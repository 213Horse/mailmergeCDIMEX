name: Deploy to VPS (Docker)
on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }} # raw hoặc base64 đều được
      VPS_PORT: ${{ secrets.VPS_PORT }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
      HOST_PORT: ${{ secrets.HOST_PORT }}
      CONTAINER_PORT: ${{ secrets.CONTAINER_PORT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image tags
        id: meta
        run: |
          set -e
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          REPO_PATH=${REGISTRY}/${OWNER_LC}/${IMAGE_LC}
          echo "repo_path=${REPO_PATH}"       >> "$GITHUB_OUTPUT"
          echo "tag_sha=${GITHUB_SHA}"        >> "$GITHUB_OUTPUT"
          echo "tag_latest=latest"            >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          set -e
          docker build -t "${{ steps.meta.outputs.repo_path }}:${{ steps.meta.outputs.tag_sha }}" \
                       -t "${{ steps.meta.outputs.repo_path }}:${{ steps.meta.outputs.tag_latest }}" .
          docker push "${{ steps.meta.outputs.repo_path }}:${{ steps.meta.outputs.tag_sha }}"
          docker push "${{ steps.meta.outputs.repo_path }}:${{ steps.meta.outputs.tag_latest }}"

      - name: Prepare SSH key & known_hosts
        run: |
          set -e
          # Normalize secrets (remove accidental whitespace/newlines)
          VPS_HOST="$(printf "%s" "${VPS_HOST:-}" | tr -d ' \t\r\n')"
          VPS_USER="$(printf "%s" "${VPS_USER:-}" | tr -d ' \t\r\n')"
          VPS_PORT="$(printf "%s" "${VPS_PORT:-}" | tr -d ' \t\r\n')"

          # Fail sớm nếu thiếu secrets
          [ -n "${VPS_HOST:-}" ] || (echo "::error::Missing secret VPS_HOST" && exit 1)
          [ -n "${VPS_USER:-}" ] || (echo "::error::Missing secret VPS_USER" && exit 1)
          [ -n "${VPS_SSH_KEY:-}" ] || (echo "::error::Missing secret VPS_SSH_KEY" && exit 1)
          VPS_PORT="${VPS_PORT:-22}"

          # Ghi key an toàn (hỗ trợ multiline + loại bỏ CRLF), hỗ trợ raw hoặc base64
          mkdir -p ~/.ssh
          printf "%s" "${VPS_SSH_KEY}" | tr -d '\r' > vps_key.raw
          (base64 -d < vps_key.raw > vps_key 2>/dev/null) || cp vps_key.raw vps_key
          chmod 600 vps_key
          # ssh-keyscan đôi khi fail trên runner (firewall/timeout). Không để fail job.
          ssh-keyscan -T 10 -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Preflight TCP connectivity to VPS
        run: |
          set -e
          VPS_HOST="$(printf "%s" "${VPS_HOST:-}" | tr -d ' \t\r\n')"
          VPS_PORT="$(printf "%s" "${VPS_PORT:-22}" | tr -d ' \t\r\n')"
          echo "Checking TCP connectivity to VPS_HOST:VPS_PORT ..."
          timeout 12 bash -lc "cat < /dev/null > /dev/tcp/${VPS_HOST}/${VPS_PORT}" \
            && echo "OK: TCP ${VPS_HOST}:${VPS_PORT} reachable" \
            || (echo "::error::Cannot reach ${VPS_HOST}:${VPS_PORT} from GitHub runner (timeout/firewall/SG)" && exit 1)

      - name: Upload deploy script to server
        run: |
          set -e
          VPS_PORT="${VPS_PORT:-22}"
          # Script này phải tồn tại trong repo: .github/scripts/deploy.sh
          # (Không cần chmod +x vì sẽ gọi qua "bash /tmp/deploy.sh")
          scp -P "${VPS_PORT}" -i vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            .github/scripts/deploy.sh "${VPS_USER}@${VPS_HOST}:/tmp/deploy.sh"

      - name: Deploy on VPS
        env:
          REPO_PATH: ${{ steps.meta.outputs.repo_path }}
          TAG_SHA: ${{ steps.meta.outputs.tag_sha }}
        run: |
          set -e
          VPS_PORT="${VPS_PORT:-22}"
          ssh -p "${VPS_PORT}" -i vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "${VPS_USER}@${VPS_HOST}" \
            IMAGE_NAME="${IMAGE_NAME}" \
            REPO_PATH="${REPO_PATH}" \
            TAG_SHA="${TAG_SHA}" \
            HOST_PORT="${HOST_PORT}" \
            CONTAINER_PORT="${CONTAINER_PORT}" \
            DOMAIN="${DOMAIN}" \
            GHCR_USERNAME="${GHCR_USERNAME}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            PROD_ENV_FILE="${PROD_ENV_FILE}" \
            bash /tmp/deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f vps_key
